[package]
name = "fig-scene"
version = "0.1.0"
edition = "2021"
description = "A very small pixel-art scene painter for Reading Buddy. No dependencies, compiles to wasm."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
